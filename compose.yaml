services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: hn_knowledge
      POSTGRES_USER: hn_knowledge
      POSTGRES_PASSWORD: hn_knowledge
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hn_knowledge -d hn_knowledge"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 2s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
